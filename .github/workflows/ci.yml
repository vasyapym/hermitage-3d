name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm budget
      # The records lane's own check (the ratified shape: caps, pointer resolution, the
      # no-citations law, the Standing-protocol immutability). WARNING-level this round per
      # the owner's ratification — blocking next round.
      - run: node tools/records-check.mjs
        continue-on-error: true
  e2e:
    runs-on: ubuntu-latest
    env:
      # Selects the SwiftShader launch args in playwright.config.ts (GPU-less runner).
      ZIMNY_SOFTWARE_GL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Smoke project only; webServer in playwright.config.ts builds and serves the app.
      - run: pnpm exec playwright test --project=chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
