
<!-- hermitage-3d / St George's Hall (Large Throne Room) - step-4 shared ornament plate (the record's step-4 plate line). ONE drawing, two palettes (gilt = ceiling plate seen from below, parquet = floor plate), rasterised into the shared 1024x1024 ETC1S plate. Canvas = one quadrant of the 45.04 x 10.20 m field (22.52 x 5.10 m; 1 px ~ 1 cm). The rasteriser mirrors it 2x2: left/bottom edges are the field's outer border, right/top edges are the field's centre lines (medallion = quarter at the top-right corner). Law: no state symbols in this drawing - the parquet repeats the plafond's ornament "за исключением государственных символов". Paint is class-only (p1..p6, fills only; no colours in this file) - hexes live in ornament-palettes.txt. -->
